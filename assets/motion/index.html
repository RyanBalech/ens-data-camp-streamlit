<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Allocation Lab research header</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; overflow: hidden; color: #f6f7fb; font-family: Arial, Helvetica, sans-serif; }
    header { position: relative; isolation: isolate; padding: 8px 0 10px; }
    .halo { pointer-events: none; position: absolute; z-index: -1; inset: 0 0 0 30%; background: radial-gradient(ellipse at 70% 30%,rgba(169,149,255,.12),transparent 68%); }
    .eyebrow { display: inline-block; color: #d7cbff; background: rgba(155,122,255,.12); border: 1px solid rgba(175,149,255,.25); border-radius: 30px; padding: .45rem .8rem; font-size: .66rem; letter-spacing: .14em; font-weight: 700; }
    h1 { font-size: clamp(2.5rem,5.1vw,4.6rem); font-weight: 750; letter-spacing: -.065em; line-height: 1.05; margin: 16px 0 22px; max-width: 900px; }
    p { color: #b5bdd1; font-size: 16px; max-width: 690px; line-height: 1.7; margin: 0 0 14px; }
    @media(max-width:480px) { h1 { font-size: 2.5rem; } p { font-size: 15px; } }
  </style>
</head>
<body><div id="root"></div><script src="./header.js"></script></body>
</html>
