image: python:3.10-slim@sha256:fd76ade0c607f27677bc04be3c60749f400eedc941d9e72967e19a4cedff80c2

motion-build:
  image: node:24.19.0-slim
  before_script: []
  script:
    - sha256sum assets/motion/header.js assets/motion/header.js.LEGAL.txt > /tmp/motion-checksums
    - cd frontend && npm ci --ignore-scripts && npm run build && cd ..
    - sha256sum -c /tmp/motion-checksums

before_script:
  - pip install -r requirements.txt

test:
  script:
    - python -m compileall -q app.py hec
    - python -m pytest --cov=hec --cov-report=term-missing --cov-report=xml --junitxml=report.xml --cov-fail-under=95
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
