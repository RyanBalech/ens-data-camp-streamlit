name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest --cov=hec --cov-report=term-missing --cov-fail-under=95
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts && npm run build
        working-directory: frontend
      - run: git diff --exit-code -- assets/motion
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t allocation-lab .
      - name: Check container startup
        run: |
          docker run -d --name allocation-lab -p 8501:8501 allocation-lab
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs allocation-lab
          exit 1
      - run: docker exec allocation-lab python -m pytest --cov=hec --cov-fail-under=95
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_browser.py
      - if: always()
        run: docker rm -f allocation-lab || true
